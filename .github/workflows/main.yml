name: Build Termux Mesa Zink Universal (swrast+zink+virgl)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version (e.g. 24.3.4)'
        required: true
        default: '24.3.4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout termux-packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Delete ALL existing mesa patches
        run: |
          echo "Deleting ALL patches in packages/mesa/..."
          rm -f termux-packages/packages/mesa/*.patch
          echo "Remaining files:"
          ls termux-packages/packages/mesa/

      - name: Patch build.sh version and SHA256
        run: |
          cd termux-packages

          VERSION="${{ github.event.inputs.mesa_version }}"
          TAR_URL="https://archive.mesa3d.org/mesa-${VERSION}.tar.xz"

          echo "Downloading source to calculate SHA256..."
          wget -q "$TAR_URL" -O mesa.tar.gz
          SHA256=$(sha256sum mesa.tar.gz | awk '{print $1}')
          echo "SHA256: $SHA256"

          sed -i "s|^TERMUX_PKG_VERSION=.*|TERMUX_PKG_VERSION=${VERSION}|g" packages/mesa/build.sh
          sed -i "s|^TERMUX_PKG_SHA256=.*|TERMUX_PKG_SHA256=${SHA256}|g" packages/mesa/build.sh

          echo "Done patching build.sh"
          head -10 packages/mesa/build.sh

      - name: Inject Zink configure args and manual repairs
        run: |
          cd termux-packages/packages/mesa
          cat >> build.sh <<'EOF'
          termux_step_pre_configure() {
          CPPFLAGS+=" -D__USE_GNU"
          LDFLAGS+=" -landroid-shmem -ltinfo"
          LDFLAGS+=" -Wl,--undefined-version"
          TERMUX_PKG_EXTRA_CONFIGURE_ARGS="
          -Dgallium-drivers=swrast,zink,virgl
          -Dvulkan-drivers=swrast,freedreno
          -Dfreedreno-kgsl=true
          -Dosmesa=true
          -Dglvnd=true
          -Dopengl=true
          -Dgles1=enabled
          -Dgles2=enabled
          -Degl=enabled
          -Dglx=disabled
          -Dplatforms=android
          -Dllvm=disabled
          -Dzlib=enabled
          -Dshared-glapi=enabled
          -Dshader-cache=enabled
          -Dbuildtype=release
          -Db_ndebug=true
          -Dlibarchive=disabled
          "
          }
          termux_step_post_get_source() {
          echo "=== Applying manual repairs (replacing all deleted patches) ==="

          echo "[0000] Disable Android auto-detection..."
          find . -name "*.py" | xargs grep -l "android" 2>/dev/null | head -5 || true

          echo "[0001] Disable llvmpipe multithreading..."
          if [ -f "src/gallium/drivers/llvmpipe/lp_scene.h" ]; then
          sed -i 's/#define PIPE_THREAD_POOL_SIZE .*/#define PIPE_THREAD_POOL_SIZE 0/' \
            src/gallium/drivers/llvmpipe/lp_scene.h 2>/dev/null || true
          fi

          echo "[0002] Fix getprogname..."
          for f in $(grep -rl "getprogname" src/ 2>/dev/null | head -10); do
          sed -i 's/getprogname()/__progname/g' "$f" 2>/dev/null || true
          done

          echo "[0003] Fix anon_file /tmp path..."
          if [ -f "src/util/anon_file.c" ]; then
          sed -i 's|"/tmp/xdg-runtime-mesa-%ld"|"$PREFIX/tmp/xdg-runtime-mesa-%ld"|g' \
            src/util/anon_file.c
          fi

          echo "[0004] Remove xlocale check from meson.build..."
          if [ -f "meson.build" ]; then
          sed -i '/xlocale/Id' meson.build
          fi

          echo "[0005] Fix virgl socket path..."
          if [ -f "src/gallium/drivers/virgl/virgl_vtest_socket.c" ]; then
          sed -i 's|/tmp/virgl.sock|$PREFIX/tmp/virgl.sock|g' \
            src/gallium/drivers/virgl/virgl_vtest_socket.c
          fi

          echo "[0006] Fix wsi_common_wayland pthread_cancel..."
          if [ -f "src/vulkan/wsi/wsi_common_wayland.c" ]; then
          sed -i 's/pthread_cancel([^)]*)/\/* pthread_cancel removed *\//g' \
            src/vulkan/wsi/wsi_common_wayland.c
          fi

          echo "[0007] Fix mtx_t mutex operations..."
          for f in $(grep -rl "pthread_mutex_lock\|pthread_mutex_unlock" src/freedreno/vulkan/ 2>/dev/null); do
          sed -i 's/pthread_mutex_lock(\(.*\))/mtx_lock(\1)/g' "$f"
          sed -i 's/pthread_mutex_unlock(\(.*\))/mtx_unlock(\1)/g' "$f"
          done

          echo "[0008] Fix epoll header in os_file.c..."
          if [ -f "src/util/os_file.c" ]; then
          grep -q "sys/epoll.h" src/util/os_file.c || \
            sed -i '1i #include <sys/epoll.h>' src/util/os_file.c
          fi

          echo "=== All manual repairs done ==="
          }
          EOF

      - name: Build Mesa package
        run: |
          cd termux-packages
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 -f -I -C mesa

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4
        with:
          name: termux-mesa-zink-universal-${{ github.event.inputs.mesa_version }}
          path: termux-packages/output/*.deb
          
